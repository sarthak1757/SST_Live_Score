<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament - SST Live</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <div id="status"><div class="empty">Loading tournament...</div></div>
  <div id="content" hidden>
    <h1 id="title"></h1>
    <p class="muted" id="subtitle"></p>
    <h2>Standings</h2>
    <div id="standings"></div>
    <p class="muted" style="margin-top:8px">Win = 3 points, draw = 1, loss = 0. Ties are split by goal difference (GD), then goals for (GF). Only finished group matches count. The top 4 go into the knockout bracket.</p>
    <h2>Knockout bracket</h2>
    <div id="bracket"></div>
    <div id="bracket-admin"></div>
    <div id="leaderboard"></div>
    <h2>Matches</h2>
    <div id="matches"></div>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/tournament.js"></script>
</body>
</html>
