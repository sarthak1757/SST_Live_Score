<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scorer login - SST Live</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main style="max-width:420px">
  <h1>Welcome <em>Back</em></h1>
  <div class="card">
    <p class="muted" style="margin:0 0 10px">Use your Scaler / SST Google account.</p>
    <div id="google-btn" style="min-height:44px"></div>
    <div id="google-msg"></div>
  </div>
  <h2>Staff <em>password</em> login</h2>
  <form class="card" id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div id="msg"></div>
    <button type="submit" id="submit" style="width:100%;margin-top:8px">Log in</button>
  </form>
  <p class="muted">Watching matches needs no account - <a href="/">go to scores</a>. Signing in lets you react, chat and follow houses. <a href="/privacy.html">Privacy</a></p>
</main>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
