<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match - SST Live</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <div id="status"><div class="empty">Loading match...</div></div>
  <div id="content" hidden>
    <div class="row between">
      <div id="meta" class="muted"></div>
      <div><span id="conn" class="badge warn">Connecting...</span> <span id="state"></span></div>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <div class="reactions" id="reactions"></div>
    <div id="sets"></div>
    <div id="top-scorers"></div>
    <h2>Live feed</h2>
    <ul class="feed" id="feed"></ul>
    <h2>Fan chat</h2>
    <div id="comment-form"></div>
    <ul class="feed comments" id="comments"><li class="muted">Loading comments...</li></ul>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/match.js"></script>
</body>
</html>
