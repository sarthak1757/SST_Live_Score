<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SST Live - Inter-house scores</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <section class="hero">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <p class="eyebrow">Inter-house tournaments</p>
    <h1 class="hero-title">Live <em>Every</em> Match</h1>
    <p class="hero-sub">Live scores, results and standings from every match. No login needed.</p>
  </section>
  <div class="stat-cards" id="stat-cards"></div>
  <div class="tabs" id="sport-tabs"><button class="tab active" data-sport="">All sports</button></div>
  <div id="matches" class="anchor"><div class="empty">Loading matches...</div></div>

  <h2>Tournaments</h2>
  <div id="tournaments"><div class="empty">Loading tournaments...</div></div>
</main>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
