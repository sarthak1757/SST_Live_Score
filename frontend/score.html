<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Score match - SST Live</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <div id="status"><div class="empty">Loading match...</div></div>
  <div id="content" hidden>
    <div class="row between">
      <div id="meta" class="muted"></div>
      <div id="state"></div>
    </div>
        <div class="controls" id="controls"></div>
    <div id="clock-bar"></div>
    <div class="score-pad" id="pad"></div>
    <div id="sets" style="margin-top:14px"></div>
    <p><a id="public-link" href="#" target="_blank" rel="noopener">Open public view &rarr;</a> &nbsp; <a id="audit-link" href="#" hidden>Audit log &rarr;</a></p>
    <h2>Recent actions</h2>
    <ul class="feed" id="feed"></ul>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/score.js"></script>
</body>
</html>
