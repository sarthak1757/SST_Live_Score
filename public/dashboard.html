<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - SST Live</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <h1>Dashboard</h1>
  <div id="global-msg"></div>

  <div id="admin-area" hidden>
    <h2>Create tournament</h2>
    <form class="card" id="tournament-form">
      <label for="t-name">Tournament name</label>
      <input id="t-name" maxlength="80" required placeholder="e.g. Inter-house Football 2026">
      <label for="t-sport">Sport</label>
      <select id="t-sport" required></select>
      <label for="t-teams">Houses / teams (one per line, at least 2)</label>
      <textarea id="t-teams" rows="5" placeholder="Red&#10;Blue&#10;Green&#10;Yellow" required></textarea>
      <div id="t-msg"></div>
      <button type="submit" style="margin-top:8px">Create tournament</button>
    </form>

    <h2>Schedule a match</h2>
    <form class="card" id="match-form">
      <label for="m-tournament">Tournament</label>
      <select id="m-tournament" required></select>
      <div class="row">
        <div style="flex:1;min-width:140px"><label for="m-a">Team A</label><select id="m-a" required></select></div>
        <div style="flex:1;min-width:140px"><label for="m-b">Team B</label><select id="m-b" required></select></div>
      </div>
      <label for="m-when">Date and time</label>
      <input id="m-when" type="datetime-local" required>
      <div id="m-msg"></div>
      <button type="submit" style="margin-top:8px" id="m-submit">Schedule match</button>
    </form>

    <h2>Add scorer account</h2>
    <form class="card" id="user-form">
      <label for="u-email">Email</label><input id="u-email" type="email" required>
      <label for="u-pass">Password (min 8 characters)</label><input id="u-pass" type="password" minlength="8" required autocomplete="new-password">
      <label for="u-role">Role</label>
      <select id="u-role"><option value="scorer">Scorer</option><option value="admin">Admin</option></select>
      <div id="u-msg"></div>
      <button type="submit" style="margin-top:8px">Create account</button>
    </form>
  </div>

  <h2>Matches to score</h2>
  <div id="matches"><div class="empty">Loading matches...</div></div>
</main>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
